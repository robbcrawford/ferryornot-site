<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Schedule Inspector — FerryOrNot</title>
<meta name="description" content="Internal tool.">
<link rel="stylesheet" href="../dev.css">
<style>
  :root{
    --parchment:#F6F1E6; --card:#FFFEF8; --ink:#1B2A41; --brass:#9C7A32;
    --hairline:#E1D6BC; --muted:#5b6472;
    --ok:#2f7d52; --warn:#b06a1e; --bad:#a33131; --track:#E8E0CC;
  }
  @media (prefers-color-scheme:dark){
    :root{--parchment:#12161F;--card:#1B2230;--ink:#F3EFE3;--brass:#D2AC55;
      --hairline:#2C333F;--muted:#9aa3b2;
      --ok:#6bbd8c;--warn:#e0a458;--bad:#e07070;--track:#2C333F}
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--parchment);color:var(--ink);
    font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  a{color:var(--brass);text-decoration:none} a:hover{text-decoration:underline}
  .wrap{max-width:1240px;margin:0 auto;padding:0 22px;width:100%}
  header{border-bottom:1px solid var(--hairline)}
  nav{display:flex;gap:22px;align-items:center;padding:18px 0;font-size:15px}
  nav .brand{margin-right:auto;display:flex;align-items:center;gap:10px;line-height:0}
  nav .brand .mark{height:26px;width:26px;border-radius:22.4%;display:block}
  nav .brand .wordmark img{height:24px;width:auto;display:block}
  h1{font-size:22px;margin:26px 0 4px}
  .sub{color:var(--muted);font-size:14px;margin:0 0 20px}
  footer{border-top:1px solid var(--hairline);margin-top:40px;padding:20px 0 26px;
    color:var(--muted);font-size:13px}

  /* ---- controls ---- */
  .controls{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;
    padding:14px 0 18px;border-bottom:1px solid var(--hairline)}
  select{padding:8px 11px;border:1px solid var(--hairline);border-radius:8px;
    background:var(--card);color:var(--ink);font-size:15px}
  .controls label{margin:0 0 4px}
  .spacer{margin-left:auto}
  .daybar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 0}
  .chip{font-size:12.5px;padding:3px 9px;border-radius:999px;border:1px solid var(--hairline);
    background:var(--card);color:var(--muted)}
  .chip.wait{border-color:var(--warn);color:var(--warn)}
  .chip.op{border-color:var(--bad);color:var(--bad)}

  /* ---- columns ---- */
  .cols{margin-top:18px}
  .coltitle{font-size:14px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
    color:var(--muted);padding-bottom:8px;border-bottom:1px solid var(--hairline)}

  /* ---- sailing block ---- */
  .sail{background:var(--card);border:1px solid var(--hairline);border-radius:10px;
    margin-top:10px;overflow:hidden}
  .sail.late{border-left:3px solid var(--warn)}
  .sail.verylate{border-left:3px solid var(--bad)}
  .sail.ontime{border-left:3px solid var(--ok)}
  .sail.pending{border-left:3px dashed var(--muted)}
  /* Matches .lrow.cancelled in the live view — the two views showed the same sailing
     differently until 2026-08-04, and the styling is part of not doing that again. */
  .sail.cancelled{border-left:3px solid var(--bad);
    background:color-mix(in srgb, var(--bad) 7%, var(--card))}
  .sail.cancelled .ct{text-decoration:line-through;color:var(--bad)}
  .sailhead{display:flex;align-items:center;gap:12px;padding:10px 13px;cursor:pointer;
    user-select:none}
  .sailhead:hover{background:color-mix(in srgb,var(--brass) 7%,transparent)}
  .times{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
  .t{font-variant-numeric:tabular-nums}
  .t .lab{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
    display:block;line-height:1.3}
  .t .val{font-size:16px}
  .t.pred .val{color:var(--brass)}
  .t.act .val{font-weight:600}
  .delay{font-size:13px;font-variant-numeric:tabular-nums}
  .delay.ok{color:var(--ok)} .delay.warn{color:var(--warn)} .delay.bad{color:var(--bad)}
  .occ{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
  .bar{width:52px;height:6px;border-radius:3px;background:var(--track);overflow:hidden}
  .bar i{display:block;height:100%;background:var(--brass)}
  .caret{color:var(--muted);font-size:12px;transition:transform .15s}
  .sail.open .caret{transform:rotate(90deg)}
  .body{display:none;padding:0 13px 14px;border-top:1px solid var(--hairline)}
  .sail.open .body{display:block}
  .kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px 18px;
    margin:12px 0;font-size:13px}
  .kv div span{display:block;color:var(--muted);font-size:11px;letter-spacing:.05em;
    text-transform:uppercase}
  .flag{display:inline-block;font-size:11.5px;padding:2px 7px;border-radius:5px;
    background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad);margin-right:5px}
  .sec{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
    margin:16px 0 6px}
  table.trail{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
  table.trail th{text-align:left;color:var(--muted);font-weight:500;padding:3px 8px 3px 0;
    font-size:11px;letter-spacing:.05em;text-transform:uppercase}
  table.trail td{padding:3px 8px 3px 0;border-top:1px solid var(--hairline)}
  .muted{color:var(--muted)}
  .empty{color:var(--muted);font-size:13px;padding:8px 0}
  svg.curve{width:100%;height:120px;display:block}
  .dir{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);
    border:1px solid var(--hairline);border-radius:5px;padding:1px 6px;white-space:nowrap}
  /* The gap between one leg arriving and the next departing — the quantity the
     turnaround model predicts, shown where it actually happens. */
  .turn{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);
    padding:5px 0 5px 16px;border-left:2px dotted var(--hairline);margin-left:14px}
  .turn b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
  .swap{font-size:11.5px;padding:2px 7px;border-radius:5px;margin-left:6px;
    background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}

  /* ---- shared vertical timeline ----
     Chips are positioned by CLOCK TIME, not by list order, so a row across the page
     is a moment: what every boat was doing at once. That is the thing a stacked list
     cannot show, and it is what makes a disrupted day legible. */
  .tl{position:relative;margin-top:10px}
  .tl-head{display:grid;gap:14px;position:sticky;top:0;z-index:20;
    background:var(--parchment);padding:8px 0 6px;border-bottom:1px solid var(--hairline)}
  .tl-body{position:relative;display:grid;gap:14px;margin-top:14px}
  .tl-rule{position:absolute;left:0;right:0;border-top:1px solid var(--hairline);
    opacity:.55;pointer-events:none}
  .tl-rule.hour{opacity:1}
  .tl-label{position:absolute;left:0;font-size:11px;color:var(--muted);
    font-variant-numeric:tabular-nums;transform:translateY(-50%);pointer-events:none}
  .tl-track{position:relative}
  .tl .sail{position:absolute;left:0;right:0;margin-top:0}
  .tl .sail.open{z-index:15;box-shadow:0 8px 28px rgba(0,0,0,.28)}
  .sailhead{padding:7px 11px;gap:9px}
  .ct{font-size:14.5px;font-variant-numeric:tabular-nums}
  .ct.act{font-weight:600}
  .ct.pred{color:var(--brass)}
  .ct-sched{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .ct-sched::before{content:"sched "}
  /* The slip from scheduled time to when the boat actually went. */
  .slip{position:absolute;width:2px;background:var(--warn);opacity:.5;left:-9px;
    border-radius:1px;pointer-events:none}
  .slip.bad{background:var(--bad);opacity:.6}
  .tl-empty{color:var(--muted);font-size:13px;padding:20px 0}
  /* Time the boat spends at the berth, drawn as the span it occupies. */
  .berth{position:absolute;left:14px;width:0;border-left:2px dotted var(--hairline);
    pointer-events:none}
  .berth-lab{position:absolute;top:50%;left:6px;transform:translateY(-50%);
    font-size:10.5px;color:var(--muted);background:var(--parchment);padding:0 3px;
    white-space:nowrap}
  /* An explained hole in the boat's day, drawn as the span it occupies. Colour
     separates "this is what the boat was doing" from "this is a hole in OUR data" —
     the second is our problem, not an operational fact, and must not read as one. */
  .gap{position:absolute;left:10px;right:6px;border-radius:6px;padding:5px 8px;
    border:1px dashed var(--hairline);background:var(--card);pointer-events:none;
    display:flex;flex-direction:column;justify-content:center;gap:2px;overflow:hidden}
  .gap-lab{font-size:11px;font-weight:600;line-height:1.25}
  .gap-sub{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .gap.service{border-color:var(--brass);background:color-mix(in srgb,var(--brass) 9%,transparent)}
  .gap.service .gap-lab{color:var(--brass)}
  .gap.maintenance{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 9%,transparent)}
  .gap.maintenance .gap-lab{color:var(--warn)}
  .gap.unrecorded-sailings{border-style:solid;border-color:var(--bad);
    background:color-mix(in srgb,var(--bad) 9%,transparent)}
  .gap.unrecorded-sailings .gap-lab{color:var(--bad)}
  .gap.no-telemetry .gap-lab,.gap.extended-layover .gap-lab,
  .gap.repositioning .gap-lab,.gap.unexplained .gap-lab{color:var(--muted)}

  /* ---- live view ----
     A plain chronological list per direction, NOT the shared timeline. The timeline
     earns its complexity by making a whole disrupted day legible at once; the live view
     is fifteen rows about the next few hours, and the question is "what will a rider be
     told", which reads better as a list than as a scaled axis. */
  .live{display:grid;gap:22px;margin-top:18px;
    grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
  .lcol .coltitle{display:flex;align-items:baseline;gap:8px}
  .lrow{background:var(--card);border:1px solid var(--hairline);border-radius:10px;
    margin-top:9px;overflow:hidden}
  .lrow.late{border-left:3px solid var(--warn)}
  .lrow.verylate{border-left:3px solid var(--bad)}
  .lrow.ontime{border-left:3px solid var(--ok)}
  .lrow.gone{opacity:.62}
  .lrow.cancelled{border-left:3px solid var(--bad);
    background:color-mix(in srgb,var(--bad) 7%,var(--card))}
  .lhead{display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer;
    user-select:none;flex-wrap:wrap}
  .lhead:hover{background:color-mix(in srgb,var(--brass) 7%,transparent)}
  .lrow.open .caret{transform:rotate(90deg)}
  .lrow .body{display:none;padding:0 12px 13px;border-top:1px solid var(--hairline)}
  .lrow.open .body{display:block}
  .lt{font-size:17px;font-variant-numeric:tabular-nums}
  .lt.act{font-weight:600} .lt.pred{color:var(--brass)}
  .lrow.cancelled .lt{text-decoration:line-through;color:var(--bad)}
  /* The band, printed as the range it is. Placed right after the point estimate so the
     two are read together — a single number with a 10-minute band beside it is a very
     different claim from the same number alone. */
  .band{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;
    white-space:nowrap}
  .band b{font-weight:600;color:var(--ink)}
  .pill{font-size:11px;padding:2px 7px;border-radius:999px;border:1px solid var(--hairline);
    color:var(--muted);white-space:nowrap}
  .pill.served{border-color:var(--ok);color:var(--ok)}
  .pill.withheld{border-color:var(--muted)}
  .pill.risk{border-color:var(--warn);color:var(--warn);
    background:color-mix(in srgb,var(--warn) 10%,transparent)}
  .pill.dead{border-color:var(--bad);color:var(--bad)}
  .rowend{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    justify-content:flex-end}
  .lsub{font-size:12px;color:var(--muted);padding:0 12px 9px;margin-top:-4px}
  .lsub .why{color:var(--bad)}
  /* The second line's label changes with what it is describing — see liveRowHTML. */
  .ct-sched[data-lab]::before{content:attr(data-lab)}

  /* ---- bulletins ---- */
  .buls{display:grid;gap:10px;margin:16px 0 4px;
    grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
  .bul{background:var(--card);border:1px solid var(--hairline);border-left:3px solid var(--hairline);
    border-radius:9px;padding:10px 12px;font-size:13px}
  .bul.op{border-left-color:var(--bad)}
  .bul h4{margin:0 0 4px;font-size:13.5px;font-weight:600;line-height:1.4}
  .bul .meta{font-size:11px;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
  .bul p{margin:5px 0 0;color:var(--muted);font-size:12.5px;line-height:1.55}
  .bul details{margin-top:6px}
  .bul summary{cursor:pointer;font-size:12px;color:var(--brass)}
  .bul .full{margin-top:7px;font-size:12px;line-height:1.6;white-space:pre-wrap;
    max-height:260px;overflow:auto;color:var(--muted)}
  /* The boundary between recorded fact and current claim. */
  .nowline{display:flex;align-items:center;gap:9px;margin:16px 0 7px;
    font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--brass)}
  .nowline::after{content:"";flex:1;border-top:1px solid var(--brass);opacity:.55}
  .nowline span{white-space:nowrap;font-variant-numeric:tabular-nums}
  .noticebox{margin-top:26px;border-top:1px solid var(--hairline);padding-top:14px}
  .noticebox>summary{cursor:pointer;font-size:13px;color:var(--muted)}
  .noticebox>summary:hover{color:var(--brass)}

  /* ---- the honesty banner ---- */
  .verdict{margin:14px 0 0;padding:11px 14px;border-radius:9px;font-size:13.5px;
    border:1px solid var(--hairline);background:var(--card);line-height:1.6}
  .verdict.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--card))}
  .verdict b{font-variant-numeric:tabular-nums}
  .verdict .note{color:var(--muted);font-size:12.5px}
  pre.json{margin:8px 0 0;padding:10px 12px;border-radius:8px;background:var(--track);
    font-size:11.5px;line-height:1.55;overflow:auto;max-height:300px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink)}
  pre.json.missing{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
</style>
</head>
<body>

<header><div class="wrap"><nav>
  <a class="brand" href="/" aria-label="FerryOrNot home">
    <img class="mark" src="/app-icon.png" alt="">
    <span class="wordmark"><picture>
      <source srcset="/wordmark-dark.png" media="(prefers-color-scheme: dark)">
      <img src="/wordmark-light.png" alt="FerryOrNot">
    </picture></span>
  </a>
  <span class="tag">Development</span>
  <a href="/development/">Dashboard</a>
  <a href="#" id="signout">Sign out</a>
</nav></div></header>

<!-- gate is injected by ../auth.js -->
<main class="wrap" id="app" style="display:none">
  <h1>Schedule Inspector</h1>
  <p class="sub" id="blurb"></p>

  <div class="controls">
    <div><label for="view">View</label><select id="view">
      <option value="live">Live</option>
      <option value="day">Service day</option>
    </select></div>
    <div><label for="route">Route</label><select id="route"></select></div>
    <div data-when="day"><label for="date">Service day</label><select id="date"></select></div>
    <div data-when="day"><label for="groupby">Group by</label><select id="groupby">
      <option value="terminal">Direction</option>
      <option value="vessel" selected>Vessel</option>
    </select></div>
    <!-- Its own control rather than sharing #groupby with the timeline: the two views
         have different defaults (a timeline reads best per vessel, a live column per
         direction) and switching view should not silently re-group the other one. -->
    <div data-when="live"><label for="livegroupby">Group by</label><select id="livegroupby">
      <option value="direction" selected>Direction</option>
      <option value="vessel">Vessel</option>
    </select></div>
    <div class="spacer"></div>
    <div id="status" class="sub" style="margin:0"></div>
  </div>

  <div id="dayview" hidden>
    <div class="daybar" id="daybar"></div>
    <div class="cols" id="cols"></div>
  </div>

  <div id="liveview" hidden>
    <div class="verdict" id="verdict"></div>
    <div class="buls" id="buls"></div>
    <div class="live" id="livecols"></div>
    <div id="notices"></div>
  </div>
</main>

<footer><div class="wrap">Internal tool — not linked from the site. Data is WSF telemetry
  plus FerryOrNot's own derived predictions.</div></footer>

<script type="module">
import { requireAuth, authedFetch, signOut } from "../auth.js";

const API = "https://fhodvdsrlbahtxsgptky.functions.supabase.co/schedule";
// The rider's endpoint, called here EXACTLY as the app calls it: no auth, no route, no
// headers of ours. That is the point of the live view — not a rendering of what we know,
// but a rendering of what we hand the phone. Reaching for the authenticated endpoint to
// fill a gap in this payload would quietly turn the preview into a lie, which is the
// failure mode the whole view exists to catch.
const FEED = "https://fhodvdsrlbahtxsgptky.functions.supabase.co/predictions";
const $ = (id) => document.getElementById(id);

// ---- data ----------------------------------------------------------------
const call = (qs) => authedFetch(API + (qs || ""));

const pacTime = (iso) => iso ? new Date(iso).toLocaleTimeString("en-US",
  { timeZone:"America/Los_Angeles", hour:"2-digit", minute:"2-digit", hour12:false }) : "—";
// Today in ferry time, as YYYY-MM-DD to match date_only. Computed in Pacific
// rather than from the browser clock so it stays right from any timezone; "en-CA"
// is the locale that formats as YYYY-MM-DD.
const pacificToday = () => new Intl.DateTimeFormat("en-CA",
  { timeZone:"America/Los_Angeles", year:"numeric", month:"2-digit", day:"2-digit" })
  .format(new Date());

function delayClass(m){ if (m == null) return ""; if (m <= 5) return "ok";
  return m <= 20 ? "warn" : "bad"; }

function sailClass(s){
  // CANCELLED FIRST. 2026-08-04: timeadjbyroute withdrew the 08:45 Bainbridge→Seattle
  // and this timeline drew it as an ordinary pending chip labelled "overdue" — telling
  // a reader to keep waiting for a boat WSF had cancelled. Overdue and cancelled are
  // opposite news, and this test has to come first because a cancelled sailing is ALSO
  // pending (no actual) and its `basis` still carries the OVERDUE marker.
  if (isCancelled(s)) return "cancelled";
  if (!s.actual) return "pending";
  if (s.delay == null) return "";
  return s.delay <= 5 ? "ontime" : (s.delay <= 20 ? "late" : "verylate");
}

// ONE definition, used by the timeline, the live rows and both summaries.
//
// `cancelled` is now the ANSWER, computed once in the backend's
// sailing_cancellation_state and served by BOTH schedule_day and schedule_live. It used
// to be prose-only in the live payload and absent entirely from the service-day payload,
// so each consumer combined the ingredients itself — three sites did, and the timeline
// was the one that never got the rule.
//
// The `status` half is kept as a belt-and-braces fallback in the same spirit as the
// app's wire-format rule: if the field ever goes missing server-side, absent must not
// read as "running".
function isCancelled(s){ return !!s.cancelled || s.status === "CANCELED"; }

// Boarding curve. x = minutes until scheduled departure, counting DOWN to 0, which is
// the axis the cliff actually happens on. Sales anchors marked because "when did this
// sailing open" matters more than the slope.
function curveSVG(s){
  const all = (s.curve || []).filter(p => p[0] != null && p[1] != null);
  if (all.length < 2) return '<div class="empty">No boarding reads for this sailing.</div>';

  // AUTO-FIT rather than a fixed window. The collector logs from D-180, so most
  // sailings carry a long flat zero region that squashes the part worth seeing. But a
  // fixed cutoff is wrong too: measured over 1357 sailings, trimming at D-60 would
  // truncate 24% of them and OVER HALF of both Bremerton directions, which open far
  // earlier than the rest (median first sale D-65 against D-44..50 elsewhere; earliest
  // observed D-180). So: start just before this sailing's own first sale and let each
  // chart size itself. Quiet sailings zoom in, early-opening ones keep their curve.
  const firstSale = all.findIndex(p => p[1] > 0);
  const LEAD = 3;   // a few reads of context before anything sells
  const pts = firstSale > LEAD ? all.slice(firstSale - LEAD) : all;
  const xs = pts.map(p => p[0]);
  const xMax = Math.max(...xs), xMin = Math.min(...xs);
  const W = 600, H = 120, PADL = 28, PADB = 18, PADT = 8;
  const sx = (m) => PADL + (xMax - m) / Math.max(1,(xMax - xMin)) * (W - PADL - 8);
  const sy = (o) => PADT + (1 - Math.min(100,o)/100) * (H - PADT - PADB);
  const d = pts.map((p,i) => (i ? "L" : "M") + sx(p[0]).toFixed(1) + " " + sy(p[1]).toFixed(1)).join(" ");
  // Minutes run positive BEFORE the slot and negative after it, because the read ramp
  // keeps sampling past departure. Render the sign as D−/D+ rather than emitting "D−-4".
  const dLabel = (m) => m >= 0 ? `D\u2212${m}` : `D+${-m}`;
  const marks = [];
  const anchor = (iso, label, colour) => {
    if (!iso || !s.sched) return;
    const mins = Math.round((new Date(s.sched) - new Date(iso)) / 60000);
    if (mins > xMax || mins < xMin) return;
    const x = sx(mins).toFixed(1);
    marks.push(`<line x1="${x}" y1="${PADT}" x2="${x}" y2="${H-PADB}" stroke="${colour}"
      stroke-width="1" stroke-dasharray="3 3"/>
      <text x="${x}" y="${PADT+9}" font-size="9" fill="${colour}" text-anchor="middle">${label}</text>`);
  };
  anchor(s.firstSale, "opened", "var(--muted)");
  anchor(s.soldOut, "sold out", "var(--bad)");
  return `<svg class="curve" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <line x1="${PADL}" y1="${sy(100)}" x2="${W-8}" y2="${sy(100)}" stroke="var(--hairline)"/>
    <line x1="${PADL}" y1="${sy(0)}" x2="${W-8}" y2="${sy(0)}" stroke="var(--hairline)"/>
    <text x="2" y="${sy(100)+4}" font-size="9" fill="var(--muted)">100%</text>
    <text x="8" y="${sy(0)+4}" font-size="9" fill="var(--muted)">0</text>
    <text x="${PADL}" y="${H-4}" font-size="9" fill="var(--muted)">${dLabel(xMax)}</text>
    <text x="${W-8}" y="${H-4}" font-size="9" fill="var(--muted)" text-anchor="end">${dLabel(xMin)}</text>
    ${marks.join("")}
    <path d="${d}" fill="none" stroke="var(--brass)" stroke-width="2"/>
  </svg>`;
}

function trailTable(s){
  if (!s.trail || !s.trail.length)
    return '<div class="empty">No prediction trail — this sailing departed before ' +
           'prediction history was recorded, or its prediction never changed.</div>';
  return `<table class="trail"><thead><tr>
      <th>Made at</th><th>Lead</th><th>Predicted</th><th>Depth</th><th>Conf</th><th>Basis</th>
    </tr></thead><tbody>` +
    s.trail.map(r => `<tr>
      <td>${pacTime(r.at)}</td>
      <td class="muted">${r.lead == null ? "—" : (r.lead >= 0 ? "T−"+r.lead+"m" : "T+"+(-r.lead)+"m")}</td>
      <td>${pacTime(r.depart)}</td>
      <td class="muted">${r.depth ?? "—"}</td>
      <td class="muted">${r.conf ?? "—"}</td>
      <td class="muted">${r.basis ?? "—"}</td>
    </tr>`).join("") + `</tbody></table>`;
}

function sailingHTML(s, showDir){
  const occ = s.occupancy;
  const flags = (s.dq ? s.dq.split(";") : []).map(f => `<span class="flag">${f}</span>`).join("");
  // A substitution is worth seeing: a swap and a cancellation are opposite rider
  // outcomes, and only the swap leaves the boat still coming.
  const swapped = s.vesselId && s.plannedVesselId &&
                  String(s.vesselId) !== String(s.plannedVesselId);
  const swapBadge = swapped
    ? `<span class="swap">in for ${s.plannedVessel || s.plannedVesselId}</span>` : "";
  // On the timeline the chip's POSITION already states when the boat went, so the
  // header collapses to one line: the time that matters, the scheduled time it is
  // measured against, and the delay. Anything taller and chips collide at real ferry
  // headways — measured before this change, 9 of 20 consecutive pairs overlapped.
  const cancelled = isCancelled(s);
  // A cancelled sailing is still `pending` and still carries an OVERDUE basis, so this
  // has to be guarded rather than tested independently.
  const overdue = !cancelled && (s.basis || "").includes("OVERDUE");
  const lead = cancelled ? pacTime(s.predicted || s.sched)
             : s.actual ? pacTime(s.actual)
             : overdue ? "overdue"
             : s.predicted ? pacTime(s.predicted) : "—";
  // The delay chip is suppressed on a cancelled row: a delay measured against a
  // withdrawn schedule is invented, which is the same reason persistence refuses to
  // anchor on one.
  const head = `<div class="sailhead" title="${s.id}">
      <span class="caret">▸</span>
      ${showDir ? `<span class="dir">${s.dirLabel}</span>` : ""}
      <span class="ct ${cancelled ? "" : s.actual ? "act" : "pred"}">${lead}</span>
      <span class="ct-sched">${pacTime(s.sched)}</span>
      ${cancelled
        ? `<span class="pill dead" title="${s.cancelSource === "bulletin"
              ? "From WSF bulletin prose — annotation, not the structured signal"
              : "From timeadjbyroute — the structured signal"}">cancelled${
              s.cancelSource === "bulletin" ? " (bulletin)" : ""}</span>`
        : s.delay != null ? `<span class="delay ${delayClass(s.delay)}">+${s.delay}m</span>` : ""}
      ${swapBadge}
      <div class="occ">
        ${occ != null ? `<span>${occ}%</span><span class="bar"><i style="width:${Math.min(100,occ)}%"></i></span>` : ""}
      </div>
    </div>`;
  return `<div class="sail ${sailClass(s)}" data-id="${s.id}">
    ${head}
    <div class="body">
      <div class="kv">
        <div><span>id</span>${s.id}</div>
        <div><span>vessel</span>${s.vessel || "—"}</div>
        <div><span>status</span>${s.status || "—"}</div>
        <div><span>arrived</span>${pacTime(s.arrived)}</div>
        <div><span>crossing</span>${s.crossing != null ? s.crossing+" min" : "—"}</div>
        <div><span>turnaround</span>${s.turnaround != null ? s.turnaround+" min" : "—"}</div>
        <div><span>drive-up</span>${s.driveUpTotal != null
              ? (s.driveUpTotal - (s.driveUpRemaining ?? 0)) + " / " + s.driveUpTotal : "—"}</div>
        <div><span>terminal wait</span>${s.waitHours == null ? "unknown"
              : (s.waitHours === 0 ? "no extended wait" : s.waitHours + "h")}</div>
        <div><span>confidence</span>${s.confidence || "—"}${
              s.depth != null ? ` <span class="muted">(depth ${s.depth})</span>` : ""}</div>
        <div><span>basis</span>${s.basis || "—"}</div>
        <div><span>inbound leg</span>${s.inbound || "—"}</div>
        <div><span>opened / sold out</span>${pacTime(s.firstSale)} / ${
              s.soldOut ? pacTime(s.soldOut) : "—"}</div>
      </div>
      ${flags ? `<div>${flags}</div>` : ""}
      <div class="sec">Boarding curve</div>
      ${curveSVG(s)}
      <div class="sec">Prediction trail</div>
      ${trailTable(s)}
    </div>
  </div>`;
}

// Grouping by VESSEL rather than by direction. The prediction model is vessel-follow
// — each sailing's departure is the previous leg's arrival plus a turnaround — so a
// per-terminal layout splits exactly the chain you need to read, putting a leg and
// its own inbound in different columns.
//
// Sailings are keyed on the ACTUAL vessel where one exists and the PLANNED vessel
// otherwise, because vessel_id is only written at departure: without the fallback,
// every not-yet-departed sailing (the half carrying the predictions) would collapse
// into one "unassigned" column.
function groupsFor(payload, mode){
  const all = [];
  for (const d of payload.directions || []){
    for (const s of d.sailings) all.push({ ...s, dirCode: d.code, dirLabel: d.label });
  }
  if (mode !== "vessel"){
    return (payload.directions || []).map(d => ({
      label: d.label,
      sailings: d.sailings.map(s => ({ ...s, dirCode: d.code, dirLabel: d.label })),
      showDir: false
    }));
  }
  const by = new Map();
  for (const s of all){
    const id = s.vesselId ?? s.plannedVesselId;
    const key = id == null ? "unassigned" : String(id);
    if (!by.has(key)) by.set(key, { id, name: s.vessel || s.plannedVessel, sailings: [] });
    const g = by.get(key);
    if (!g.name) g.name = s.vessel || s.plannedVessel;
    g.sailings.push(s);
  }
  return [...by.values()]
    .map(g => ({
      // `id` is carried through, not just folded into the label: the gap blocks are
      // keyed on vessel id and have to find their own track.
      id: g.id,
      label: (g.name || `Vessel ${g.id ?? "?"}`) + (g.id != null ? ` · ${g.id}` : ""),
      sailings: g.sailings.sort((a,b) => new Date(a.sched) - new Date(b.sched)),
      showDir: true
    }))
    .sort((a,b) => a.label.localeCompare(b.label));
}

// The layover between one leg arriving and the next departing, drawn ON the axis as
// the span it actually occupies. Only meaningful in vessel mode, where consecutive
// chips in a track are genuinely consecutive legs of one boat.
function turnMarkup(prev, s, y, chipTop){
  if (!prev || !prev.arrived) return "";
  const to = s.actual || s.predicted;
  if (!to) return "";
  const mins = Math.round((new Date(to) - new Date(prev.arrived)) / 60000);
  if (mins < 0 || mins > 240) return "";
  const top = y(prev.arrived), h = Math.max(2, chipTop - top);
  return `<div class="berth" style="top:${top - chipTop}px;height:${h}px">
            <span class="berth-lab">${mins}m</span></div>`;
}

// Labels come from known_berths, which is owner-editable, so escape rather than trust.
// Quotes are in the set because the live view interpolates WSF's own bulletin prose into
// title="..." attributes, and that text is written by someone else entirely.
const esc = (t) => String(t ?? "").replace(/[<>&"']/g,
  (c) => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;", '"': "&quot;", "'": "&#39;" }[c]));

// An explained hole in the boat's day, drawn as the span it occupies on the axis —
// the same treatment as the berth line, because it IS the berth line's big sibling:
// turnMarkup gives up above 240 minutes, which is exactly where these live.
//
// Only in vessel mode. Grouped by direction, consecutive chips are not consecutive legs
// of one boat, so a span drawn between them would be meaningless.
function gapMarkup(gaps, group, y, mode){
  if (mode !== "vessel" || !gaps.length || group.id == null) return "";
  return gaps.filter(g => String(g.vesselId) === String(group.id)).map(g => {
    const top = y(g.from), h = Math.max(22, y(g.to) - top);
    // Say what it was, then how long. The count of unrecorded crossings is the whole
    // point of that class, so it leads there instead of the duration.
    const sub = g.classification === "unrecorded-sailings"
      ? `${g.crossings} crossing${g.crossings === 1 ? "" : "s"} missing · ${g.minutes}m`
      : `${g.minutes}m` + (g.movedMinutes ? ` · ${g.movedMinutes}m under way` : "");
    return `<div class="gap ${g.classification}" style="top:${top}px;height:${h}px">
              <div class="gap-lab">${esc(g.label)}</div>
              <div class="gap-sub">${sub}</div>
            </div>`;
  }).join("");
}

// Where a chip sits on the axis: when the boat ACTUALLY went, falling back to the
// prediction and then to the schedule. Positioning by scheduled time would draw the
// timetable rather than the day — a boat an hour late would still sit in its printed
// slot, which is precisely the discrepancy worth seeing.
const chipTime = (s) => s.actual || s.predicted || s.sched;

const PX_PER_MIN = 1.7;   // ~45-min headway ≈ 76px, enough for a compact chip
const CHIP_H = 60;   // measured height of a collapsed chip; drives overlap detection

function render(payload){
  const cols = $("cols");
  const mode = $("groupby").value;
  const groups = groupsFor(payload, mode);
  const all = groups.flatMap(g => g.sailings);
  if (!all.length){ cols.innerHTML = '<div class="tl-empty">No sailings for this day.</div>'; return; }

  const times = all.map(s => new Date(chipTime(s)).getTime());
  // Round out to whole hours so the gridlines read as clock times.
  const startMs = Math.floor(Math.min(...times) / 3600000) * 3600000;
  const endMs   = Math.ceil((Math.max(...times) + 20*60000) / 3600000) * 3600000;
  const minsFrom = (ms) => (ms - startMs) / 60000;
  const y = (iso) => minsFrom(new Date(iso).getTime()) * PX_PER_MIN;
  const height = minsFrom(endMs) * PX_PER_MIN + CHIP_H;
  const gridCols = `54px repeat(${groups.length}, minmax(0,1fr))`;

  // Hour rules span the full width so the eye can carry a moment across columns.
  let rules = "";
  for (let ms = startMs; ms <= endMs; ms += 1800000){
    const top = y(new Date(ms).toISOString());
    const onHour = (ms % 3600000) === 0;
    rules += `<div class="tl-rule ${onHour ? "hour" : ""}" style="top:${top}px"></div>`;
    if (onHour) rules += `<div class="tl-label" style="top:${top}px">${pacTime(new Date(ms).toISOString())}</div>`;
  }

  // Genuinely simultaneous chips share the track's width, calendar-style, rather than
  // being nudged apart. Nudging would preserve legibility by lying about the time,
  // which defeats the axis. Observed on 2026-07-25: a phantom slot cleared back to
  // SCHEDULED sits exactly where another boat actually departed — they really are at
  // the same moment, and the layout should say so.
  const laneOf = (sailings) => {
    const items = sailings.map((s, i) => ({ i, top: y(chipTime(s)) }))
                          .sort((a,b) => a.top - b.top);
    const lanes = new Array(sailings.length).fill(null);
    let cluster = [];
    const flush = () => {
      cluster.forEach((it, k) => lanes[it.i] = { lane: k, of: cluster.length });
      cluster = [];
    };
    for (const it of items){
      if (cluster.length && it.top >= Math.max(...cluster.map(c => c.top)) + CHIP_H) flush();
      cluster.push(it);
    }
    flush();
    return lanes;
  };

  const tracks = groups.map(g => {
    let prev = null;
    const lanes = laneOf(g.sailings);
    const chips = g.sailings.map((s, idx) => {
      const top = y(chipTime(s));
      // A vertical stem from the printed slot down to when it actually left: delay
      // rendered as a length rather than a number you have to subtract.
      const berth = mode === "vessel" ? turnMarkup(prev, s, y, top) : "";
      prev = s;
      let slip = "";
      if (s.actual && s.delay != null && s.delay >= 3){
        const from = y(s.sched), h = Math.max(2, top - from);
        slip = `<div class="slip ${s.delay > 20 ? "bad" : ""}" style="top:${from - top}px;height:${h}px"></div>`;
      }
      const L = lanes[idx] || { lane: 0, of: 1 };
      const w = 100 / L.of, x = L.lane * w;
      return `<div style="position:absolute;top:${top}px;left:${x}%;width:${w}%;
                          padding-right:${L.of > 1 ? 4 : 0}px">${berth}${slip}${
        sailingHTML(s, g.showDir)}</div>`;
    }).join("");
    // Gaps render BEFORE the chips so a sailing chip is never covered by the block
    // explaining the silence around it.
    return `<div class="tl-track">${gapMarkup(payload.gaps || [], g, y, mode)}${chips}</div>`;
  }).join("");

  cols.innerHTML = `
    <div class="tl">
      <div class="tl-head" style="grid-template-columns:${gridCols}">
        <div></div>
        ${groups.map(g => `<div class="coltitle" style="border:0;padding:0">${g.label}
          <span class="muted">(${g.sailings.length})</span></div>`).join("")}
      </div>
      <div class="tl-body" style="grid-template-columns:${gridCols};height:${height}px">
        ${rules}
        <div></div>
        ${tracks}
      </div>
    </div>`;

  const bar = [];
  for (const w of payload.waits || []){
    bar.push(`<span class="chip wait">${w.direction} — ${
      w.hours === 0 ? "wait cleared" : w.hours + "h wait"} @ ${pacTime(w.from)}</span>`);
  }
  for (const a of payload.alerts || []){
    bar.push(`<span class="chip ${a.operational ? "op" : ""}" title="${a.title.replace(/"/g,"&quot;")}">${
      a.title.length > 74 ? a.title.slice(0,74) + "…" : a.title}</span>`);
  }
  $("daybar").innerHTML = bar.join("");

  cols.querySelectorAll(".sailhead").forEach(h => {
    h.onclick = () => h.parentElement.classList.toggle("open");
  });
}

// ==========================================================================
// LIVE VIEW — what the model says right now, next to what the app is handed.
//
// Two payloads, fetched separately and joined here:
//
//   schedule_live()  (authenticated)  everything we know: the cascade, the challenger
//                                     band, occupancy, the named vessel, cancellations
//   /predictions     (public, no auth) the rider's feed, byte-for-byte
//
// Rendering only the first would be the easy version and would have hidden a five-day
// outage: on 2026-07-30 a migration dropped `departed` and `usable` from the feed, the
// app's decoder throws on a missing key, and PredictionClient swallows its own errors —
// so every rider silently fell back to the on-device forecast while every internal view
// still looked perfect. A preview of what we serve has to be built from what we serve.
// ==========================================================================

const LIVE_REFRESH_MS = 60000;   // the collector re-cascades once a minute; matching it
let liveTimer = null;

// Both payloads carry the same scheduled departure straight out of the same column, so
// the instant is the join key. Compared as epoch ms rather than as strings: Postgres
// emits fractional seconds on some timestamps and not others.
const keyOf = (dir, sched) => dir + "@" + new Date(sched).getTime();

// OPERATIONAL BULLETINS LEAD AND SHOW THEIR TEXT; NOTICES COLLAPSE TO A TITLE. On a
// normal day WSF has five to ten bulletins in force and most are lane closures and
// elevator outages — expanded equally they push the sailings, which are the point of the
// page, off the first screen entirely. `operational` is WSF's own distinction between
// "service is different today" and "here is a notice", so it is the right axis to sort
// and size on.
function bulletinHTML(b){
  const dirs = (b.directions || []).join(", ");
  const body = (b.body || "").replace(/<[^>]*>/g, " ").replace(/\s{2,}/g, " ").trim();
  const showText = b.operational && b.text;
  const detail = [showText ? "" : (b.text || ""), body !== (b.text || "").trim() ? body : ""]
    .filter(Boolean).join("\n\n");
  return `<div class="bul ${b.operational ? "op" : ""}">
    <div class="meta">${b.operational ? "Operational" : "Notice"} · ${pacTime(b.publishedAt)}
      · ${esc(b.allRoutes ? "all routes" : dirs)}</div>
    <h4>${esc(b.title)}</h4>
    ${showText ? `<p>${esc(b.text)}</p>` : ""}
    ${detail ? `<details><summary>Full bulletin</summary>
           <div class="full">${esc(detail)}</div></details>` : ""}
  </div>`;
}

// One sailing, as a rider-facing claim first and an internals dump second.
// ONE SAILING. The operational detail comes from schedule_live; every TIME and every
// claim about lateness comes from the app feed, because the feed is the thing under
// review. There is no model here to show: a departure is either observed, or it is the
// vessel's last observed delay carried forward (persistence), or we say nothing and
// print the timetable.
const sign = (m) => (m > 0 ? "+" : "") + m + "m";

function liveRowHTML(s, f){
  const gone = !!(f?.actual_depart ?? s.actual);
  const delay = f?.delay_minutes ?? null;
  const basis = f?.basis ?? (f ? "schedule" : null);
  // CANCELLED — one shared definition, see isCancelled(). This branch used to combine
  // the two signals itself, which worked; the service-day timeline did not, which did
  // not. `s.cancelled` is now the backend's own combined verdict and `s.cancelSource`
  // says which signal produced it, so the distinction between the structured feed and
  // the prose parse survives without every consumer having to re-establish it.
  const cancelled = isCancelled(s);
  const cls = cancelled ? "cancelled"
            : (gone ? "gone " : "") + (delay == null ? ""
               : delay <= 5 ? "ontime" : delay <= 20 ? "late" : "verylate");

  // The headline is what a rider would be told, in the order of what we actually know:
  // when it went, then our carried-forward estimate, then the printed slot.
  // OVERDUE IS DERIVED FROM THE CLOCK, not from the feed's `appears_not_to_have_run`.
  // That flag is written by the demoted predictor's refresh pass, so it is an artifact
  // we no longer drive anything from — and it disagrees with the record: sailings an
  // hour past their slot with nothing observed were coming back false and rendering as
  // an ordinary timetable row. 20 minutes of grace so a merely-late boat is not libelled.
  const overdue = !gone && !cancelled &&
                  Date.now() - new Date(s.sched).getTime() > 20 * 60000;
  const shown = gone ? pacTime(f?.actual_depart ?? s.actual)
              : overdue ? "no departure seen"
              : (f?.usable && f?.predicted_depart) ? pacTime(f.predicted_depart)
              : pacTime(s.sched);

  // A BOAT STILL AT THE DOCK IS NOT "+38 LATE" — IT IS LATER EVERY MINUTE. On an overdue
  // slot the carried estimate is a floor, not a measurement: whatever we thought, the
  // sailing is at least as late as the clock says and still growing. Printing the plain
  // estimate there states a number we have already been proven wrong about.
  const overdueBy = Math.round((Date.now() - new Date(s.sched).getTime()) / 60000);
  const delayChip = cancelled ? ""
    : overdue
      ? `<span class="delay ${delayClass(overdueBy)}" title="Nothing observed yet — at
           least this late, and growing">≥&nbsp;${sign(Math.max(overdueBy, delay ?? 0))}</span>`
      : delay != null
        ? `<span class="delay ${delayClass(delay)}">${sign(delay)}</span>` : "";

  // WSF'S OWN NUMBER, SHOWN BESIDE OURS RATHER THAN BLENDED INTO IT. When both exist
  // they are two independent claims about the same thing and the gap between them is
  // the single most useful number on the row — agreement is corroboration, divergence
  // is the thing to go and look at.
  const wsf = (f?.wsf_stated_low != null)
    ? `<span class="band" title="WSF's own published figure for this direction">WSF <b>${
         f.wsf_stated_low}${f.wsf_stated_high && f.wsf_stated_high !== f.wsf_stated_low
           ? "–" + f.wsf_stated_high : ""}m</b></span>`
    : "";

  const pills = [];
  if (cancelled) pills.push('<span class="pill dead">cancelled</span>');
  else if (overdue) pills.push('<span class="pill dead">overdue</span>');
  if (!gone && !cancelled && !overdue) {
    pills.push(basis === "persistence"
      ? `<span class="pill served" title="${f.anchor_vessel ? esc(f.anchor_vessel) + " last went " +
           sign(f.carried_delay_minutes) + ", " + f.anchor_age_minutes + " min ago" : ""}">persistence ${
           f.carried_delay_minutes != null ? sign(f.carried_delay_minutes) : ""}</span>`
      : '<span class="pill withheld">timetable — no fresh anchor</span>');
  }
  if (s.priorSoldOut ?? f?.prior_sold_out) pills.push('<span class="pill risk">prior sold out</span>');
  if (!f) pills.push('<span class="pill dead">not in feed</span>');

  const occ = s.occupancy != null
    ? `<span class="occ"><span>${s.occupancy}%</span>
         <span class="bar"><i style="width:${Math.min(100, s.occupancy)}%"></i></span></span>` : "";

  const why = cancelled && s.cancelPhrase
    ? `<div class="lsub"><span class="why">WSF: “${esc(s.cancelPhrase)}”</span></div>` : "";

  const kv = [
    ["scheduled", pacTime(s.sched)],
    ["actual departure", pacTime(f?.actual_depart ?? s.actual)],
    ["actual arrival", pacTime(s.arrived)],
    ["estimate", f?.predicted_depart ? pacTime(f.predicted_depart) : "—"],
    ["source", esc(basis || "—")],
    ["anchor", f?.carried_delay_minutes != null
       ? `${esc(f.anchor_vessel || "?")} ${sign(f.carried_delay_minutes)}, ${
            f.anchor_age_minutes}m ago` : "—"],
    ["WSF says", f?.wsf_stated_low != null
       ? `${f.wsf_stated_low}–${f.wsf_stated_high}m behind` : "—"],
    ["vessel", esc(s.vessel || s.plannedVessel || "—")],
    ["planned vessel", esc(s.plannedVessel || "—")],
    ["crossing", s.crossing != null ? s.crossing + " min" : "—"],
    ["turnaround", s.turnaround != null ? s.turnaround + " min" : "—"],
    ["drive-up", s.driveUpTotal != null
       ? (s.driveUpTotal - (s.driveUpRemaining ?? 0)) + " / " + s.driveUpTotal : "—"],
    ["terminal wait", s.waitHours == null ? "unknown"
       : (s.waitHours === 0 ? "no extended wait" : s.waitHours + "h")],
  ].map(([k, v]) => `<div><span>${k}</span>${v}</div>`).join("");

  // Grouped by vessel, the column no longer states the direction, so the row has to —
  // otherwise a boat's day reads as an undifferentiated list of times.
  const dirTag = (window.__liveGroupBy === "vessel" && s.dirLabel)
    ? `<span class="dir">${esc(s.dirLabel)}</span>` : "";
  return `<div class="lrow ${cls}" data-id="${esc(s.id)}">
    <div class="lhead" title="${esc(s.id)}">
      <span class="caret">▸</span>
      ${dirTag}
      <span class="lt ${gone ? "act" : (f?.usable ? "pred" : "")}">${shown}</span>
      <span class="ct-sched">${pacTime(s.sched)}</span>
      ${delayChip}
      ${wsf}
      <span class="rowend">${pills.join("")}${occ}</span>
    </div>
    ${why}
    <div class="body">
      <div class="kv">${kv}</div>
      <div class="sec">What the app receives for this sailing</div>
      ${f
        ? `<pre class="json">${esc(JSON.stringify(f, null, 2))}</pre>`
        : `<pre class="json missing">This sailing is not in the /predictions payload.
The app cannot show it at all.</pre>`}
    </div>
  </div>`;
}

function renderLive(live, feed){
  const routeSel = $("route").value;
  // This view redraws itself every minute. Without carrying the expanded rows across,
  // reading the JSON behind a sailing would be a race against the refresh.
  const open = new Set([...$("livecols").querySelectorAll(".lrow.open")]
    .map(el => el.dataset.id));
  const byKey = new Map();
  for (const r of (feed?.sailings || [])) byKey.set(keyOf(r.direction_code, r.scheduled_depart), r);

  const sailings = (live.sailings || []).filter(s => routeSel === "all" || s.routeId === routeSel);

  // ---- the honesty banner. Reads the two payloads against each other and says what a
  // rider would be told, rather than what we happen to know.
  const feedMissing = sailings.filter(s => !byKey.has(keyOf(s.direction, s.sched)));
  const rows = sailings.map(s => byKey.get(keyOf(s.direction, s.sched))).filter(Boolean);
  const observed = rows.filter(r => r.basis === "observed");
  // Was a third local copy of the cancellation rule; now the shared isCancelled().
  const upcoming = sailings.filter(s => !s.actual && !isCancelled(s));
  const carried = rows.filter(r => r.basis === "persistence");
  const bare = rows.filter(r => r.basis === "schedule" && !r.departed);
  const cancelled = sailings.filter(isCancelled);
  const feedBroken = !feed;
  const parts = [];
  if (feedBroken) {
    parts.push(`<b>The app feed did not answer.</b> Everything below is what we know, not
      what a rider is being told.`);
  } else {
    parts.push(`App feed carries the whole service day —
      <b>${feed.sailings.length}</b> sailings across all routes, generated ${
      pacTime(feed.generatedAt)}.`);
    if (feedMissing.length) {
      parts.push(`<b>${feedMissing.length}</b> of this route's sailings ${
        feedMissing.length === 1 ? "is" : "are"} missing from it.`);
    }
    parts.push(`On this route: <b>${observed.length}</b> departures we recorded and WSF no
      longer publishes, <b>${carried.length}</b> ahead carrying their vessel's last
      observed delay, <b>${bare.length}</b> on the bare timetable
      <span class="note">(no departure anchor inside ${
        feed.anchorMaxAgeMinutes ?? 120} minutes, past which a carried delay stops beating
      the schedule)</span>.`);
  }
  if (cancelled.length) parts.push(`<b>${cancelled.length}</b> cancelled.`);
  $("verdict").className = "verdict" + (feedBroken || feedMissing.length ? " bad" : "");
  $("verdict").innerHTML = parts.join(" ");

  // ---- bulletins in force, for the selected route
  // Operational bulletins sit ABOVE the sailings because they change what the boats do;
  // notices go below, collapsed. Ranked equally they filled the first screen with lane
  // closures and elevator outages and pushed the departures — the answer this page
  // exists to give — off it.
  const buls = (live.bulletins || []).filter(b =>
    routeSel === "all" || b.allRoutes || (b.routeIds || []).map(String).includes(routeSel));
  const ops = buls.filter(b => b.operational);
  const notices = buls.filter(b => !b.operational);
  $("buls").innerHTML = ops.length
    ? ops.map(bulletinHTML).join("")
    : `<div class="empty">No operational WSF bulletins in force for this route today${
         notices.length ? ` — ${notices.length} notice${notices.length === 1 ? "" : "s"} below` : ""}.</div>`;
  $("notices").innerHTML = notices.length
    ? `<details class="noticebox"><summary>${notices.length} other bulletin${
         notices.length === 1 ? "" : "s"} in force — terminal notices, closures, ADA</summary>
       <div class="buls">${notices.map(bulletinHTML).join("")}</div></details>`
    : "";

  // ---- one column per group, in time order
  //
  // Direction is the default because it is how a rider thinks. Vessel is the view that
  // makes a disruption legible: a boat going out of service takes a whole COLUMN with
  // it, where by direction the same event is scattered down two columns interleaved
  // with the boat that is still running. 2026-08-04 is the case — the Chimacum's
  // cancellations read as five isolated rows by direction and as one dead column by
  // vessel.
  const groupBy = $("livegroupby")?.value ?? "direction";
  window.__liveGroupBy = groupBy;   // read by liveRowHTML for the per-row direction tag
  const dirs = new Map();
  for (const s of sailings){
    // vessel_name is rewritten from the CURRENT assignment, so group on the id where we
    // have one and fall back to the planned id — the same reason schedule_live resolves
    // the name from the vessels table rather than trusting the sailing row.
    const key = groupBy === "vessel"
      ? String(s.vesselId ?? s.plannedVesselId ?? "unassigned")
      : s.direction;
    const label = groupBy === "vessel"
      ? (s.vessel || s.plannedVessel || "Unassigned")
      : s.dirLabel;
    if (!dirs.has(key)) dirs.set(key, { label, rows: [] });
    dirs.get(key).rows.push(s);
  }
  // A NOW LINE, because the column is a whole day rather than a forward window and the
  // eye needs the boundary between "this is what happened" and "this is what we are
  // claiming".
  //
  // ⚠️ PLACED BY THE TIME THE ROW PRINTS, NOT BY THE SCHEDULED TIME. Rows are ordered
  // by slot but headlined with actual-then-estimate-then-slot, so on a late evening the
  // two disagree: the 21:00 sailing carrying +24m prints 21:24, and testing its slot put
  // it ABOVE a 21:08 divider — a boat that has not left yet, filed under what already
  // happened, showing a time later than the line above it. Whatever number the row shows
  // is the number the divider has to be compared against, or the column reads as
  // out of order.
  const now = Date.now();
  // Mirror of liveRowHTML's `shown`: keep these two in step or the divider drifts again.
  const headlineTime = (s, f) => {
    const actual = f?.actual_depart ?? s.actual;
    if (actual) return new Date(actual).getTime();
    if (f?.usable && f?.predicted_depart) return new Date(f.predicted_depart).getTime();
    return new Date(s.sched).getTime();
  };
  const withDivider = (rows) => {
    let placed = false;
    return rows.map(s => {
      const f = byKey.get(keyOf(s.direction, s.sched));
      let lead = "";
      if (!placed && headlineTime(s, f) > now) {
        placed = true;
        lead = `<div class="nowline"><span>now · ${pacTime(new Date().toISOString())}</span></div>`;
      }
      return lead + liveRowHTML(s, f);
    }).join("");
  };

  // Sort on the LABEL, not the key: grouped by vessel the key is a numeric id, so
  // sorting by it ordered the columns by WSF's internal vessel number.
  $("livecols").innerHTML = dirs.size
    ? [...dirs.entries()].sort((a,b) => a[1].label.localeCompare(b[1].label)).map(([code, d]) => `
        <div class="lcol">
          <div class="coltitle">${esc(d.label)}
            <span class="muted">(${d.rows.length})</span></div>
          ${withDivider(d.rows)}
        </div>`).join("")
    : '<div class="tl-empty">Nothing scheduled in this window.</div>';

  $("livecols").querySelectorAll(".lrow").forEach(row => {
    if (open.has(row.dataset.id)) row.classList.add("open");
    row.querySelector(".lhead").onclick = () => row.classList.toggle("open");
  });
}

async function loadLive(){
  $("status").textContent = "Loading…";
  let live;
  try {
    live = await call("?live=1");
  } catch (e) {
    if (e.message !== "signed out") $("status").textContent = "Error: " + e.message;
    return;
  }
  // The app feed is fetched exactly as the app fetches it, so a failure here is a real
  // finding and must not be styled as a page error: the internals still render, and the
  // banner says the rider half is missing.
  let feed = null;
  try {
    const res = await fetch(FEED);
    if (res.ok) feed = await res.json();
  } catch { /* reported in the banner */ }

  window.__live = live; window.__feed = feed;
  renderLive(live, feed);
  $("status").textContent = `as of ${pacTime(live.generatedAt)} · refreshes every minute`;
}

async function load(){
  const d = $("date").value, r = $("route").value;
  if (!d || !r) return;
  $("status").textContent = "Loading…";
  try {
    const payload = await call(`?date=${encodeURIComponent(d)}&route=${encodeURIComponent(r)}`);
    window.__payload = payload;
    render(payload);
    const n = (payload.directions||[]).reduce((a,x)=>a+x.sailings.length,0);
    $("status").textContent = `${n} sailings`;
  } catch (e) {
    if (e.message !== "signed out") $("status").textContent = "Error: " + e.message;
  }
}

// ---- view switching ------------------------------------------------------
// The view lives in the URL hash so a view is linkable and survives a reload. Live is
// the default: the day view answers "what happened", which is a question you go looking
// for, while the live view answers "what are we telling riders right now", which is the
// one worth landing on.
const BLURB = {
  live: `The whole service day as the app receives it: departures we actually recorded —
     WSF drops those from its own feed within minutes — and, ahead of now, each vessel's
     last observed delay carried forward. No model; that predictor was demoted on
     2026-08-03. WSF's own stated figure is shown beside ours, never blended into it.`,
  day: `Scheduled, predicted and actual departures, with the boarding curve and
     prediction trail behind each sailing. Hover a sailing to copy its id.`,
};

function applyView(){
  const v = $("view").value;
  document.querySelectorAll("[data-when]").forEach(el => {
    el.style.display = el.dataset.when === v ? "" : "none";
  });
  // "All routes" is a live-view option only, so arriving at the day view holding it
  // would ask schedule_day for a route that does not exist and draw an empty board.
  if (v === "day" && $("route").value === "all") $("route").value = window.__lastDayRoute;
  $("dayview").hidden = v !== "day";
  $("liveview").hidden = v !== "live";
  $("blurb").textContent = BLURB[v];
  location.hash = v;

  // Only the live view polls. Leaving the timer running under the day view would keep
  // re-fetching a payload nobody is looking at, and — worse — would eventually re-render
  // over a sailing the reader had expanded.
  clearInterval(liveTimer); liveTimer = null;
  if (v === "live"){
    loadLive();
    liveTimer = setInterval(loadLive, LIVE_REFRESH_MS);
  } else {
    load();
  }
}

async function boot(){
  try {
    const meta = await call("");
    // "All routes" only in the live view — the day view's timeline is scaled to one
    // route's sailings and six directions of chips would be unreadable on it.
    $("route").innerHTML = `<option value="all">All routes</option>` + meta.routes.map(r =>
      `<option value="${r.routeId}">${esc(r.label)}</option>`).join("");
    $("route").value = meta.routes[0]?.routeId ?? "all";
    window.__lastDayRoute = $("route").value;
    const days = meta.days || [];
    $("date").innerHTML = days.map(d => `<option value="${d}">${d}</option>`).join("");
    // Days come back newest-first, but the newest is usually a stub of a handful of
    // post-midnight sailings filed under TOMORROW's calendar date — the WSF
    // service-day mismatch. Selecting it opens the inspector on a near-empty board,
    // so default to today and fall back to newest only if today has nothing yet.
    $("date").value = days.includes(pacificToday()) ? pacificToday() : (days[0] ?? "");

    $("route").onchange = () => {
      if ($("view").value === "live"){
        // Route is a filter over data already in hand, so re-render rather than refetch
        // — and refetching would be worse than wasteful: the feed is route-blind, so the
        // second request would return the same bytes.
        if (window.__live) renderLive(window.__live, window.__feed);
      } else if ($("route").value === "all"){
        $("route").value = window.__lastDayRoute; load();
      } else { window.__lastDayRoute = $("route").value; load(); }
    };
    $("date").onchange = load;
    // Grouping is a view of data already in hand — re-render, do not refetch.
    $("groupby").onchange = () => { if (window.__payload) render(window.__payload); };
    $("livegroupby").onchange = () => {
      if (window.__live) renderLive(window.__live, window.__feed);
    };
    $("view").onchange = applyView;

    $("view").value = location.hash === "#day" ? "day" : "live";
    applyView();
  } catch (e) {
    if (e.message !== "signed out") $("status").textContent = "Error: " + e.message;
  }
}

$("signout").onclick = (e) => { e.preventDefault(); signOut(); };
await requireAuth();
$("app").style.display = "";
boot();
</script>
</body>
